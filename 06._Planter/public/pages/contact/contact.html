<h1>Contact</h1>

<p>Submit a message below if you have any questions or feedback</p>

<form action="/api/contact" method="POST">
    <fieldset>
        <label for="topic">Topic</label>
        <input id="topic" name="topic" placeholder="topic" value="plant drowned">

        <label for="name">Name</label>
        <input id="name" name="name" placeholder="name" value="Me">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required placeholder="email" value="mail@mail.dk">

        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="message..." rows="15" cols="60"></textarea>

        <button>Submit</button>
    </fieldset>
</form>
